- version: 0.2.0
  changes:
  - description: New optional inference_stats data stream (CEL input polling trained-model and ingest-pipeline statistics) and the [Claude Code Transcripts] ML Inference Admin dashboard. Every processor tagged and standard pipeline on_failure; pipeline tests; generated field reference in the README; documentation style fixes. Same pipelines and dataset names as 0.1.4 otherwise.
