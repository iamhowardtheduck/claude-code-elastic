name: Deploy deck to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "deck/**"
      - "deck-performance/**"
      - "deck-inference/**"
      - "deck-full/**"
      - "deck-models/**"
      - "docs/claude-code-transcripts-deck.pdf"
      - "docs/claude-code-transcripts-load-test.pdf"
      - "docs/claude-code-transcripts-inference.pdf"
      - "docs/claude-code-transcripts-full.pdf"
      - "docs/claude-code-transcripts-models.pdf"
      - ".github/workflows/deck-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: deck
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npx fslides build ../_site
        working-directory: deck
      - run: npm install --no-audit --no-fund
        working-directory: deck-performance
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npx fslides build ../_site/load-test
        working-directory: deck-performance
      - run: npm install --no-audit --no-fund
        working-directory: deck-inference
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npx fslides build ../_site/inference
        working-directory: deck-inference
      - run: npm install --no-audit --no-fund
        working-directory: deck-full
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npx fslides build ../_site/full
        working-directory: deck-full
      - run: npm install --no-audit --no-fund
        working-directory: deck-models
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npx fslides build ../_site/models
        working-directory: deck-models
      - run: cp docs/claude-code-transcripts-*.pdf _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
