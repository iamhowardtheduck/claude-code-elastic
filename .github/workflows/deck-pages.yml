name: Deploy decks to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "deck/**"
      - "deck-performance/**"
      - "deck-inference/**"
      - "deck-full/**"
      - "deck-models/**"
      - "claude/**"
      - "docs/**/*.pdf"
      - ".github/workflows/deck-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the 10 decks (combined, Claude Code only)
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          set -e
          build() {   # deck dir, path under the Pages site (parents before their subfolders)
            (cd "$1" && npm install --no-audit --no-fund && npx fslides build "$GITHUB_WORKSPACE/_site/$2")
          }
          for set in "" claude/; do
            build "${set}deck"             "${set}"
            build "${set}deck-performance" "${set}load-test"
            build "${set}deck-inference"   "${set}inference"
            build "${set}deck-full"        "${set}full"
            build "${set}deck-models"      "${set}models"
          done
      - name: Add the PDFs
        run: |
          cp docs/claude-code-transcripts-*.pdf _site/
          cp docs/claude/*.pdf _site/claude/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
